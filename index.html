<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Мониторинг здоровья виноградников Молдовы"
    />
    <title>VitiGuard MD</title>
    <!-- Тема ставится до отрисовки, иначе тёмная тема мигнёт светлой при загрузке -->
    <script>
      try {
        const theme = localStorage.getItem('vitiguard.theme')
        const dark =
          theme === 'dark' ||
          (theme !== 'light' &&
            matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
